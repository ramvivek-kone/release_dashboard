<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Release Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="app.css?v=1.2">
</head>
<body class="present">
<header>
  <img class="logo" id="logo" src="assets/kone-logo.png" alt="KONE">
  <div class="titles"><h1 id="title" title="Double-click to open Settings">R&amp;D Execution</h1></div>
  <div class="seg" id="modeSeg"><button data-m="present" class="on">▶ Present</button><button data-m="interact">☝ Interact</button></div>
  <div class="clock"><b id="clock">--:--</b><span id="today"></span><br><span class="chip" id="scenChip" title="Press P to toggle"></span></div>
  <button class="gear" id="gearBtn" title="Settings (S)" aria-label="Open settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
  </button>
</header>

<section id="top">
  <div id="hero"></div>
  <div id="rail"></div>
  <div id="tstat"></div>
</section>

<main id="stage">
  <div class="card" id="tlCard">
    <div class="tlHead"><h2 id="tlTitle">Project timeline</h2><small id="tlNote"></small>
      <span class="legend"><span><i style="background:var(--sky)"></i>Planned</span><span><i style="background:var(--blue)"></i>Done</span><span><i style="background:var(--red)"></i>Delay</span><span><i style="background:var(--amber)"></i>Impacted task</span></span></div>
    <div id="teamFilter"></div>
    <div id="gantt"></div>
  </div>
  <aside class="card" id="panel"></aside>
</main>

<footer>
  <div id="scrub"><span id="hint">space ⏯ · ←/→ scene</span><div class="track"><i id="scrubBar"></i></div><div class="dots" id="scrubDots"></div></div>
  <span id="src"></span><span id="foot"></span>
</footer>

<div id="settings" class="overlay" hidden></div>
<div id="dropAll">Drop your Excel file here to load it</div>
<div id="toast"></div>

<script src="vendor/xlsx.full.min.js"></script>
<script src="js/util.js"></script>
<script src="js/defaults.js"></script>
<script src="js/excel.js"></script>
<script src="js/settings.js"></script>
<script src="js/engine.js"></script>
<script src="js/sample.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
